<button
  class="ff-button__native"
  [disabled]="disabled() || loading()"
  [attr.aria-disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <span class="ff-button__spinner" aria-hidden="true"></span>
  } @else {
    <ng-content select="[ffButtonPrefix]" />
  }
  <span class="ff-button__content">
    <ng-content />
  </span>
  <ng-content select="[ffButtonSuffix]" />
</button>
