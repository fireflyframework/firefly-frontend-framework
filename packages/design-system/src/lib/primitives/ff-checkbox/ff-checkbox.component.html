<label class="ff-checkbox__wrapper" [for]="inputId">
  <input
    class="ff-checkbox__native"
    type="checkbox"
    [id]="inputId"
    [checked]="effectiveChecked()"
    [indeterminate]="indeterminate()"
    [disabled]="effectiveDisabled()"
    [attr.aria-checked]="indeterminate() ? 'mixed' : effectiveChecked()"
    (change)="onChange($event)"
  />
  <span class="ff-checkbox__box" aria-hidden="true"></span>
  @if (label()) {
    <span class="ff-checkbox__label">{{ label() }}</span>
  }
</label>
