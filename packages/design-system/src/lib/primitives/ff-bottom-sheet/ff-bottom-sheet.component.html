@if (open()) {
  <div
    class="ff-bottom-sheet__backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title() || undefined"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div class="ff-bottom-sheet__panel ff-bottom-sheet__panel--{{ type() }}">
      @if (title() || dismissible()) {
        <header class="ff-bottom-sheet__header">
          @if (title()) {
            <h2 class="ff-bottom-sheet__title">{{ title() }}</h2>
          }
          @if (dismissible()) {
            <button
              class="ff-bottom-sheet__close"
              type="button"
              aria-label="Close"
              (click)="dismissed.emit()"
            >&#x2715;</button>
          }
        </header>
      }
      <div class="ff-bottom-sheet__body">
        @if (message()) {
          <p class="ff-bottom-sheet__message">{{ message() }}</p>
        }
        <ng-content />
      </div>
      <footer class="ff-bottom-sheet__footer">
        <ng-content select="[ff-bottom-sheet-actions]" />
      </footer>
    </div>
  </div>
}
