@if (open()) {
  <div
    class="ff-dialog__backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title() || undefined"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
  >
    <div class="ff-dialog__panel">
      @if (title()) {
        <header class="ff-dialog__header">
          <h2 class="ff-dialog__title">{{ title() }}</h2>
          @if (dismissible()) {
            <button
              class="ff-dialog__close"
              type="button"
              aria-label="Close"
              (click)="closed.emit()"
            >&#x2715;</button>
          }
        </header>
      }
      <div class="ff-dialog__body">
        <ng-content />
      </div>
      <footer class="ff-dialog__footer">
        <ng-content select="[ff-dialog-actions]" />
      </footer>
    </div>
  </div>
}
