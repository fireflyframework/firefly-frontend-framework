@for (option of options(); track option.value) {
  <label
    class="ff-radio__item"
    [class.ff-radio__item--selected]="option.value === value()"
    [class.ff-radio__item--disabled]="isOptionDisabled(option)"
  >
    <input
      class="ff-radio__native"
      type="radio"
      [name]="effectiveName"
      [value]="option.value"
      [checked]="option.value === value()"
      [disabled]="isOptionDisabled(option)"
      (change)="onSelect(option)"
    />
    <span class="ff-radio__dot" aria-hidden="true"></span>
    <span class="ff-radio__label">{{ option.label }}</span>
  </label>
}
