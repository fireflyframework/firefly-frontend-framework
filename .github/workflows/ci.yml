name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch develop branch for nx affected
        if: github.ref != 'refs/heads/develop'
        run: git fetch origin develop:develop --no-tags

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - run: pnpm nx affected -t lint
      - run: pnpm nx affected -t test
      - run: pnpm nx affected -t build

      # TODO: Cuando se configuren tests e2e, añadir:
      # - run: npx playwright install --with-deps
      # - run: pnpm nx affected -t e2e

  template:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: fireflyframework/firefly-product-template
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: 'npm'

      - name: Install template dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build template
        run: npm run build

  showcase:
    needs: template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout showcase
        uses: actions/checkout@v4
        with:
          repository: fireflyframework/firefly-showcase
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: 'npm'

      - name: Install showcase dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build showcase
        run: npm run build
