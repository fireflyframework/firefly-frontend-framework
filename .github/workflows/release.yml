name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - core
          - utils
          - both
      version:
        description: 'Version to release (e.g. 0.6.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build packages
        run: pnpm nx run-many --target=build --projects=core,utils

      - name: Publish utils
        if: inputs.package == 'utils' || inputs.package == 'both'
        run: |
          cd dist/packages/utils
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Publish core
        if: inputs.package == 'core' || inputs.package == 'both'
        run: |
          cd dist/packages/core
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Tag utils
        if: inputs.package == 'utils' || inputs.package == 'both'
        run: |
          VERSION=$(node -p "require('./packages/utils/package.json').version")
          git tag -a "utils@${VERSION}" -m "Release @fireflyframework/utils v${VERSION}"
          git push origin "utils@${VERSION}"

      - name: Tag core
        if: inputs.package == 'core' || inputs.package == 'both'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag -a "core@${VERSION}" -m "Release @fireflyframework/core v${VERSION}"
          git push origin "core@${VERSION}"
