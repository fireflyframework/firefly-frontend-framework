name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (folder name, e.g. "core", "utils", "design-system")'
        required: true
        type: string
      version:
        description: 'Version to publish (e.g. "0.6.0"). Must match package.json'
        required: true
        type: string
      skip_publish:
        description: 'Skip npm publish (tag only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate inputs
        run: |
          PKG_DIR="packages/${{ inputs.package }}"
          if [ ! -f "${PKG_DIR}/package.json" ]; then
            echo "::error::Package directory ${PKG_DIR} not found"
            exit 1
          fi
          ACTUAL=$(node -p "require('./${PKG_DIR}/package.json').version")
          if [ "${ACTUAL}" != "${{ inputs.version }}" ]; then
            echo "::error::Version mismatch — package.json has ${ACTUAL}, input says ${{ inputs.version }}"
            exit 1
          fi

      - name: Check tag does not exist
        run: |
          TAG="${{ inputs.package }}@${{ inputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists on remote"
            exit 1
          fi

      - name: Build
        run: pnpm nx run ${{ inputs.package }}:build

      - name: Publish
        if: inputs.skip_publish == false
        run: |
          cd dist/packages/${{ inputs.package }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Tag
        run: |
          NAME=$(node -p "require('./packages/${{ inputs.package }}/package.json').name")
          TAG="${{ inputs.package }}@${{ inputs.version }}"
          git tag -a "${TAG}" -m "Release ${NAME} v${{ inputs.version }}"
          git push origin "${TAG}"
          echo "### Published ${NAME} v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
