name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to release (comma-separated, e.g. "core,utils" or "design-system")'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Release packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            PKG_DIR="packages/${pkg}"

            if [ ! -f "${PKG_DIR}/package.json" ]; then
              echo "::error::Package directory ${PKG_DIR}/package.json not found"
              exit 1
            fi

            VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
            NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
            TAG="${pkg}@${VERSION}"

            echo "=========================================="
            echo "Releasing ${NAME} v${VERSION} (tag: ${TAG})"
            echo "=========================================="

            # Check tag does not already exist
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "::error::Tag ${TAG} already exists on remote. Skipping ${pkg}."
              exit 1
            fi

            # Build
            pnpm nx run "${pkg}:build"

            # Publish
            cd "dist/${PKG_DIR}"
            npm publish
            cd -

            # Tag
            git tag -a "${TAG}" -m "Release ${NAME} v${VERSION}"
            git push origin "${TAG}"

            echo "${NAME}@${VERSION} published and tagged successfully."
          done
